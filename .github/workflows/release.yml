name: Build and Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Determine Version Name and Rename APK
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            CLEAN_VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Replaces slashes with dashes and attaches short commit hash
            CLEAN_VERSION="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          fi
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          mv app/build/outputs/apk/debug/app-debug.apk "TouchGuard-${CLEAN_VERSION}.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchGuard-${{ steps.get_version.outputs.VERSION }}
          path: TouchGuard-*.apk

      - name: Create GitHub Release (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TouchGuard-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}